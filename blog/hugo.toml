baseurl = "https://qu-bit1.github.io"
languageCode = "en-us"
theme = "terminal"
paginate = 5
summaryLength = 30

[params]
contentTypeName = "posts"
themeColor = "red"
showMenuItems = 2
showLanguageSelector = false
fullWidthTheme = false
centerTheme = true
autoCover = true
showLastUpdated = true

[languages]
  [languages.en]
    languageName = "English"
    title = "terminal"
    subtitle = "A simple, retro theme for Hugo"
    
[languages.en.params.logo]
  logoText = "don't panic"
  logoHomeLink = "/about"

[languages.en.menu]
  [[languages.en.menu.main]]
    identifier = "about"
    name = "about"
    url = "/about"
  [[languages.en.menu.main]]
    identifier = "blog"
    name = "blog"
    url = "/posts"

