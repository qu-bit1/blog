baseurl = "https://qu-bit1.github.io"
languageCode = "en-us"
theme = "terminal"

[pagination]
  pagerSize = 5

[params]
  contentTypeName = "posts"
  themeColor = "red"
  showMenuItems = 2
  showLanguageSelector = true
  fullWidthTheme = false
  centerTheme = true
  autoCover = true
  showLastUpdated = false
  readingTime = true
  Toc = true
  TocTitle = "tldr? so jump"

[params.twitter]
  creator = ""
  site = ""

[languages]
  [languages.en]
    languageName = "English"
    title = "don't panic"

    [languages.en.params]
      subtitle = "the hitchhikers guide to sagar's life"
      owner = ""
      keywords = ""
      copyright = ""
      menuMore = "Show more"
      readMore = "Read more"
      readOtherPosts = "Read other posts"
      newerPosts = "Newer posts"
      olderPosts = "Older posts"
      missingContentMessage = "Page not found..."
      missingBackButtonLabel = "Back to home page"
      minuteReadingTime = "min read"
      words = "words"

      [languages.en.params.logo]
        logoText = "don't panic"
        logoHomeLink = "/about"

    [languages.en.menu]
      [[languages.en.menu.main]]
        identifier = "about"
        name = "about"
        url = "/about"
      [[languages.en.menu.main]]
        identifier = "blog"
        name = "blog?"
        url = "/posts"

[module]
  [[module.imports]]
    path = 'terminal'

[services.disqus]
  shortname = "your-disqus-shortname"
